<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex Rally</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0e13;
        overflow: hidden;
      }
      #app {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      /* Menus (#APEX-11) inject their own styles; the host is just an anchor. */
      /* The in-game Reduce-motion setting (#APEX-12) sets data-motion on <html>;
         also suppress HUD animation for it, matching the OS @media rule. */
      html[data-motion="reduced"] .apex-hud *,
      html[data-motion="reduced"] .apex-split {
        animation: none !important;
        transition: none !important;
      }
      /* Graceful unsupported-browser screen (#APEX-14). Sits over the blank
         canvas so an unsupported browser never shows an unexplained black view. */
      #support:empty {
        display: none;
      }
      .support-screen {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
        max-width: 640px;
        margin: 0 auto;
        padding: 32px;
        background: #0b0e13;
        color: #e7eef7;
        font: 14px/1.6 system-ui, -apple-system, sans-serif;
      }
      .support-screen__title {
        margin: 0;
        font-size: 22px;
        line-height: 1.3;
      }
      .support-screen__summary {
        margin: 0;
        color: #b7c3d4;
      }
      .support-screen__label {
        margin: 8px 0 0;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 11px;
        opacity: 0.7;
      }
      .support-screen__reasons,
      .support-screen__steps {
        margin: 0;
        padding-left: 20px;
      }
      .support-screen__reasons li::marker {
        color: #ff6b6b;
      }
    </style>
  </head>
  <body>
    <div id="support"></div>
    <div id="menu"></div>
    <canvas id="app" aria-label="Apex Rally viewport"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
