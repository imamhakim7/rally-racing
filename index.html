<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex Rally</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0e13;
        overflow: hidden;
      }
      #app {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #stage-select {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 10;
        font: 13px/1.4 system-ui, sans-serif;
        color: #e7eef7;
      }
      .stage-select {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 10px;
        background: rgba(11, 14, 19, 0.72);
        border: 1px solid rgba(231, 238, 247, 0.16);
        backdrop-filter: blur(6px);
      }
      .stage-select__caption {
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 11px;
        opacity: 0.7;
      }
      .stage-select__control {
        font: inherit;
        color: inherit;
        background: #161b24;
        border: 1px solid rgba(231, 238, 247, 0.22);
        border-radius: 6px;
        padding: 4px 8px;
      }
    </style>
  </head>
  <body>
    <div id="stage-select"></div>
    <canvas id="app" aria-label="Apex Rally viewport"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
