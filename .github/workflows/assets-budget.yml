name: assets-budget

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build assets (budget gate)
        run: |
          bun run assets:sample
          bun run assets:build

      - name: Re-check budgets against the built manifest
        run: bun run assets:check

      - name: Upload budget report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex6-budget-report
          path: docs/evidence/APEX-6-budget-report.*
